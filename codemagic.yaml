workflows:
  my-first-workflow:
    name: My First Workflow
    max_build_duration: 60
    environment:
      flutter: 3.19.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build IPA
        script: |
          flutter build ipa --release --no-codesign
          find . -name "*.ipa" | xargs -I{} cp {} build/
    artifacts:
      - build/*.ipa
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - shimaa.hossni.2015@gmail.com
