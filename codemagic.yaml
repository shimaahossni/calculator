workflows:
  ios-workflow:
    name: iOS Workflow

    max_build_duration: 60

    environment:
      flutter: 3.19.0
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build iOS IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - shimaa.hossni.2015@gmail.com
