workflows:
  my-first-workflow:
    name: My First Workflow
    max_build_duration: 60
    environment:
      flutter: 3.19.0
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
